<!doctype html><body><canvas id="c" width="800" height="600"></canvas><script type="module">
import { Renderer } from '../src/gpu/renderer.js';
globalThis.SKIP = new URLSearchParams(location.search).get("skip") | 0;
const rd = await Renderer.create(document.getElementById('c')); window.rd = rd;
const log = (s) => console.log(s, 'lost=' + rd.lost);
rd.resize(800, 600, 1); await new Promise(r => setTimeout(r, 300)); log('created');
rd.begin(); rd.camera(0, 0, 1); rd.rect(10, 10, 100, 100, [1, 0, 0, 1]); rd.end(0, 0, 0); await new Promise(r => setTimeout(r, 300)); log('frame1');
const q = new URLSearchParams(location.search).get('n') | 0;
for (let i = 0; i < q; i++) { const c = new OffscreenCanvas(1000, 1000); c.getContext('2d').fillRect(0, 0, 10, 10); rd.atlas.addCanvas(c, 'keep'); await new Promise(r => setTimeout(r, 100)); log('add' + i + ' layers=' + rd.atlas.layers); }
rd.begin(); rd.camera(0, 0, 1); rd.rect(10, 10, 100, 100, [1, 0, 0, 1]); rd.end(0, 0, 0); await new Promise(r => setTimeout(r, 300)); log('frame2');
</script>
