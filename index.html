<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0a14">
<title>Hollowbound</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="screen" width="480" height="270"></canvas>
<div id="touch" hidden>
  <div class="stick"><div class="knob"></div></div>
  <div class="buttons">
    <button data-act="dash" class="b-dash">DASH</button>
    <button data-act="attack" class="b-attack">ATK</button>
    <button data-act="jump" class="b-jump">JUMP</button>
    <button data-act="interact" class="b-talk">TALK</button>
    <button data-act="potion" class="b-potion">POT</button>
  </div>
  <button data-act="pause" class="b-pause">II</button>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
